<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FEID</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =========================
         PANTALLA DE ENTRADA
         ========================= -->

    <div
        class="intro"
        id="intro"
    >

        <div class="content">

            <h1>FEID</h1>

            <p>
                הגיהינום מציית לי, כי אני דום
            </p>

            <button id="start">
                INICIAR
            </button>

        </div>

    </div>


    <!-- =========================
         HOME
         ========================= -->

    <main
        class="home"
        id="home"
    >

        <!-- MENÚ -->

        <nav class="menu">

            <button
                class="menu-main"
                id="menuButton"
            >
                FEID
                <span>+</span>
            </button>

            <div
                class="menu-options"
                id="menuOptions"
            >

                <button>HOME</button>

                <button>FRIENDS</button>

                <button>MUSIC</button>

            </div>

        </nav>


        <!-- AVATAR -->

        <section class="avatar-section">

            <div class="avatar">

                <div class="avatar-placeholder">
                    DOOM
                </div>

            </div>

        </section>


        <!-- PANTALLA DE PLANETAS -->

        <section class="universe">

            <div class="screen">

                <div class="planet planet-one"></div>

                <div class="planet planet-two"></div>

                <div class="planet planet-three"></div>

                <div class="planet planet-four"></div>

                <div class="energy"></div>

            </div>

        </section>

    </main>


    <script
        src="functions.js"
    ></script>

</body>

</html>
