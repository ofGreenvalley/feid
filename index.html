<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>FEID</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="entry">

        <!-- IMAGEN -->
        <div class="entry-image"></div>

        <!-- EFECTO TV -->
        <div class="tv-effect">
            <div class="tv-scanlines"></div>
            <div class="tv-noise"></div>
            <div class="tv-glitch"></div>
            <div class="tv-flicker"></div>
        </div>

        <!-- EFECTO CINEMATOGRÁFICO -->
        <div class="cinematic"></div>

        <!-- BOTÓN -->
        <button id="pressButton" class="press">
            INICIAR
        </button>

    </main>

    <script src="functions.js"></script>

</body>
</html>
