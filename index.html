<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FEID</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <!-- =========================
         PANTALLA DE ENTRADA
         ========================= -->

    <div
        class="intro"
        id="intro"
    >

        <div class="content">

            <h1>FEID</h1>

            <p>
                הגיהינום מציית לי, כי אני דום
            </p>

            <button
                id="start"
                type="button"
            >
                INICIAR
            </button>

            <div class="design-signature">
                Hecho a mano por Feid.
            </div>

        </div>

    </div>


    <!-- =========================
         HOME
         ========================= -->

    <main
        class="home"
        id="home"
    >


        <!-- CABECERA -->

        <header class="topbar">

            <div class="brand">
                FEID
            </div>

        </header>


        <!-- =========================
             MENÚ
             ========================= -->

        <nav class="menu">

            <button
                class="menu-main"
                id="menuButton"
                type="button"
            >

                MENU

                <span>+</span>

            </button>


            <div
                class="menu-options"
                id="menuOptions"
            >

                <button type="button">
                    HOME
                </button>

                <button type="button">
                    FRIENDS
                </button>

                <button type="button">
                    MUSIC
                </button>

            </div>

        </nav>


        <!-- =========================
             CENTRO
             ========================= -->

        <section class="central">


            <!-- AVATAR -->

            <div class="avatar-container">

                <div class="avatar-frame">

                    <div class="corner top-left"></div>

                    <div class="corner top-right"></div>

                    <div class="corner bottom-left"></div>

                    <div class="corner bottom-right"></div>


                    <div class="avatar">

                        <img
                            src="https://u.cubeupload.com/Eradicater/eedb771df5045f58db69.jpg"
                            alt="Avatar"
                        >

                    </div>

                </div>

            </div>


            <!-- =========================
                 MULTIVERSE CORE
                 ========================= -->

            <div class="universe-panel">


                <div class="panel-header">

                    <span>
                        MULTIVERSE CORE
                    </span>

                    <span class="panel-status">
                        ● UNSTABLE
                    </span>

                </div>


                <div class="screen multiverse-screen">

                    <div class="space-noise"></div>


                    <div class="reality reality-one">

                        <span>
                            REALITY_01
                        </span>

                    </div>


                    <div class="reality reality-two">

                        <span>
                            REALITY_07
                        </span>

                    </div>


                    <div class="reality reality-three">

                        <span>
                            REALITY_∞
                        </span>

                    </div>


                    <div class="core">

                        <div
                            class="core-ring ring-one"
                        ></div>

                        <div
                            class="core-ring ring-two"
                        ></div>

                        <div
                            class="core-ring ring-three"
                        ></div>

                        <div class="core-energy"></div>

                    </div>


                    <div class="core-particles">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div class="glitch-bar glitch-one"></div>

                    <div class="glitch-bar glitch-two"></div>

                    <div class="glitch-bar glitch-three"></div>


                    <div class="screen-scanline"></div>

                    <div class="signal-glitch"></div>

                </div>


                <div class="panel-footer">

                    <span>
                        REALITIES: 1,248,672
                    </span>

                    <span>
                        STABILITY: 12.6%
                    </span>

                    <span>
                        CONTAINMENT: BREACHING...
                    </span>

                </div>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="functions.js"></script>

</body>

</html>
