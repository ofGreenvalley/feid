<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FEID</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =========================
         PANTALLA DE ENTRADA
         ========================= -->

    <div
        class="intro"
        id="intro"
    >

        <div class="content">

            <h1>FEID</h1>

            <p>
                הגיהינום מציית לי, כי אני דום
            </p>

            <button id="start">
                INICIAR
            </button>

        </div>

    </div>


    <!-- =========================
         HOME
         ========================= -->

    <main
        class="home"
        id="home"
    >

        <!-- CABECERA -->

        <header class="topbar">

            <div class="brand">
                FEID
            </div>

        </header>


        <!-- MENÚ -->

        <nav class="menu">

            <button
                class="menu-main"
                id="menuButton"
            >

                MENU

                <span>+</span>

            </button>


            <div
                class="menu-options"
                id="menuOptions"
            >

                <button>
                    HOME
                </button>

                <button>
                    FRIENDS
                </button>

                <button>
                    MUSIC
                </button>

            </div>

        </nav>


        <!-- =========================
             CENTRO
             ========================= -->

        <section class="central">


            <!-- AVATAR -->

            <div class="avatar-container">

                <div class="avatar-frame">

                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>


                    <div class="avatar">

                        <img
                            src="https://u.cubeupload.com/Eradicater/eedb771df5045f58db69.jpg"
                            alt="Avatar"
                        >

                    </div>

                </div>

            </div>


            <!-- =========================
                 MONITOR
                 ========================= -->

            <div class="universe-panel">


                <div class="panel-header">

                    <span>
                        PLANETARY COLLISION
                    </span>

                    <span class="panel-status">
                        ● ACTIVE
                    </span>

                </div>


                <div class="screen">


                    <!-- ESTRELLAS -->

                    <div class="stars"></div>


                    <!-- PLANETAS -->

                    <div class="planet planet-one"></div>

                    <div class="planet planet-two"></div>

                    <div class="planet planet-three"></div>


                    <!-- EXPLOSIÓN -->

                    <div class="collision">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <!-- ESCANEO -->

                    <div class="scanline"></div>


                </div>


                <div class="panel-footer">

                    <span>
                        PLANETARY SYSTEM
                    </span>

                    <span>
                        COLLISION EVENT
                    </span>

                </div>

            </div>

        </section>

    </main>


    <script src="functions.js"></script>

</body>

</html>
