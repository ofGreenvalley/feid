<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>FEID</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =========================
         PANTALLA DE ENTRADA
    ========================== -->

    <main class="entry">

        <div class="entry-image"></div>

        <div class="tv-effect">

            <div class="tv-scanlines"></div>

            <div class="tv-noise"></div>

            <div class="tv-glitch"></div>

            <div class="tv-flicker"></div>

        </div>

        <div class="cinematic"></div>

        <button
            id="pressButton"
            class="press"
        >
            INICIAR
        </button>

    </main>


    <!-- =========================
         INTERIOR
    ========================== -->

    <main class="inside">

        <!-- IDENTIDAD -->

        <section class="identity">

            <div class="identity-title">
                Feid
            </div>

            <div class="identity-subtitle">
                יום הדין
            </div>

        </section>


        <!-- AVATAR + BOTONES -->

        <section class="profile-area">

            <button
                id="avatarButton"
                class="avatar-button"
                aria-label="Perfil"
            >

                <img
                    src="https://xatimg.com/image/NFQsj3G8hSpe.jpg"
                    alt="FEID"
                >

            </button>


            <div class="side-buttons">

                <button
                    id="plusButton"
                    class="side-button"
                    aria-label="Más"
                >
                    +
                </button>

                <button
                    id="friendsButton"
                    class="side-button"
                    aria-label="Amigos"
                >
                    👥
                </button>

                <button
                    id="musicButton"
                    class="side-button"
                    aria-label="Música"
                >
                    ♪
                </button>

            </div>

        </section>


        <!-- =========================
             MENSAJE
        ========================== -->

        <div
            id="messagePanel"
            class="floating-panel message-panel"
        >
            Bajo esta roca, edificaré mi imperio.
        </div>


        <!-- =========================
             AMIGOS
        ========================== -->

        <div
            id="friendsPanel"
            class="floating-panel friends-panel"
        >

            <div class="friends-title">
                FRIENDS
            </div>


            <div class="friend">

                <div class="friend-main">

                    <span class="status"></span>

                    <span class="friend-name">
                        Lugo
                    </span>

                </div>

                <div class="friend-description">
                    gymrat, training
                </div>

            </div>


            <div class="friend">

                <div class="friend-main">

                    <span class="status"></span>

                    <span class="friend-name">
                        Estela
                    </span>

                </div>

                <div class="friend-description">
                    working
                </div>

            </div>


            <div class="friend">

                <div class="friend-main">

                    <span class="status"></span>

                    <span class="friend-name">
                        Mar
                    </span>

                </div>

                <div class="friend-description">
                    bingueanding
                </div>

            </div>


            <div class="friend">

                <div class="friend-main">

                    <span class="status"></span>

                    <span class="friend-name">
                        Gabi
                    </span>

                </div>

                <div class="friend-description">
                    playing with me
                </div>

            </div>

        </div>


        <!-- =========================
             REPRODUCTOR VISUAL
        ========================== -->

        <div
            id="musicPanel"
            class="floating-panel music-panel"
        >

            <div class="music-top">

                <div>

                    <div class="music-artist">
                        FEID
                    </div>

                    <div class="music-title">
                        Aguante
                    </div>

                </div>


                <button
                    id="playerButton"
                    class="player-button"
                    aria-label="Reproducir"
                >
                    ▶
                </button>

            </div>


            <div class="progress-area">

                <div
                    id="progressBar"
                    class="progress-bar"
                >

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>

                </div>

            </div>


            <div class="music-times">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <!-- =========================
             YOUTUBE OCULTO
        ========================== -->

        <div
            id="youtubePlayer"
            class="youtube-hidden"
        ></div>

    </main>


    <script src="functions.js"></script>

</body>

</html>
